services:
  backend:
    build: ./backend
    ports:
      - "3080:3080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports: 
     - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - backend